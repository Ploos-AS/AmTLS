name: CI

on:
  push:
  pull_request:

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make
      - name: Test
        run: make check

  m68k-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install m68k cross compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-m68k-linux-gnu
      - name: Compile 68000 objects
        run: make CC=m68k-linux-gnu-gcc smoke-68000

  amigaos-native:
    runs-on: ubuntu-latest
    container: amigadev/m68k-amigaos:latest
    steps:
      - uses: actions/checkout@v4
      - name: Show AmigaOS toolchain
        run: |
          m68k-amigaos-gcc --version
          test -f /opt/m68k-amigaos/m68k-amigaos/ndk-include/proto/bsdsocket.h || \
            test -f /opt/m68k-amigaos/m68k-amigaos/sys-include/proto/bsdsocket.h
      - name: Compile native AmigaOS 68000 objects
        run: |
          mkdir -p build/amigaos
          CFLAGS='-Os -Wall -Wextra -Werror -std=c99 -m68000 -msoft-float'
          RESIDENT_CFLAGS='-Os -Wall -Wextra -Werror -std=gnu99 -m68000 -msoft-float -fomit-frame-pointer -Wno-unused-parameter -Wno-volatile-register-var'
          CPPFLAGS='-Iinclude -Isrc'
          m68k-amigaos-gcc $CPPFLAGS $CFLAGS -c src/amtls.c -o build/amigaos/amtls.o
          m68k-amigaos-gcc $CPPFLAGS $CFLAGS -c src/platform/allocator.c -o build/amigaos/allocator.o
          m68k-amigaos-gcc $CPPFLAGS $CFLAGS -c src/backends/handshake_pump.c -o build/amigaos/handshake_pump.o
          m68k-amigaos-gcc $CPPFLAGS $CFLAGS -c src/platform/bsdsocket_transport.c -o build/amigaos/bsdsocket_transport.o
          m68k-amigaos-gcc $CPPFLAGS $CFLAGS -c src/amiga/library_lifecycle.c -o build/amigaos/library_lifecycle.o
          m68k-amigaos-gcc $CPPFLAGS $RESIDENT_CFLAGS -c src/amiga/library_resident.c -o build/amigaos/library_resident.o
          m68k-amigaos-gcc $CPPFLAGS $CFLAGS -mcrt=nix20 cli/tlsinfo.c build/amigaos/amtls.o build/amigaos/allocator.o -o build/amigaos/TLSInfo
          m68k-amigaos-gcc $CPPFLAGS $CFLAGS -mcrt=nix20 tests/amiga/test_m3_3_openclose.c -o build/amigaos/test_m3_3_openclose
          m68k-amigaos-gcc $CPPFLAGS $CFLAGS -mcrt=nix20 tests/amiga/test_m3_3_bsdsocket.c build/amigaos/bsdsocket_transport.o -o build/amigaos/test_m3_3_bsdsocket
          m68k-amigaos-gcc -m68000 -nostdlib -nostartfiles -Wl,-Map=build/amigaos/amtls.library.map -o build/amigaos/amtls.library build/amigaos/library_resident.o
          test -s build/amigaos/TLSInfo
          test -s build/amigaos/test_m3_3_openclose
          test -s build/amigaos/test_m3_3_bsdsocket
          test -s build/amigaos/amtls.library
      - name: Stage M3.3 runtime payload
        run: |
          chmod +x tools/stage_m3_3_runtime.sh
          tools/stage_m3_3_runtime.sh
          test -s build/m3_3_runtime/Libs/amtls.library
          test -s build/m3_3_runtime/C/test_m3_3_openclose
          test -s build/m3_3_runtime/amiga-runtime.json
          python3 -m json.tool build/m3_3_runtime/amiga-runtime.json >/dev/null
          test -s build/m3_3_runtime/S/run-test
          grep -q AMTLS_M3_3_PASS build/m3_3_runtime/S/run-test
          grep -q AMTLS_M3_3B_PASS build/m3_3_runtime/S/run-test
          grep -q 'SetEnv AmTLSM33A' build/m3_3_runtime/S/run-test
          grep -q 'SetEnv AmTLSM33B' build/m3_3_runtime/S/run-test
          grep -q 'Quit 20' build/m3_3_runtime/S/run-test
      - name: Self-test M3.3 runtime verifier
        run: |
          chmod +x tools/verify_m3_3_runtime.sh
          mkdir -p build/verifier-test
          printf 'RC=0\nAMTLS_M3_3_PASS\n' > build/verifier-test/amtls-m3.3.log
          printf 'RC=0\nAMTLS_M3_3B_PASS\n' > build/verifier-test/amtls-m3.3b.log
          tools/verify_m3_3_runtime.sh build/verifier-test/amtls-m3.3.log build/verifier-test/amtls-m3.3b.log
          printf 'RC=0\nAMTLS_M3_3B_FAIL\n' > build/verifier-test/amtls-m3.3b.log
          if tools/verify_m3_3_runtime.sh build/verifier-test/amtls-m3.3.log build/verifier-test/amtls-m3.3b.log; then
            echo "verifier accepted failing M3.3b evidence" >&2
            exit 1
          fi
      - name: Upload native AmigaOS smoke artifacts
        uses: actions/upload-artifact@v4
        with:
          name: amtls-amigaos-native-smoke
          path: |
            build/amigaos/TLSInfo
            build/amigaos/test_m3_3_openclose
            build/amigaos/test_m3_3_bsdsocket
            build/amigaos/amtls.library
            build/amigaos/amtls.library.map
            build/m3_3_runtime/
          if-no-files-found: error

  bearssl-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install m68k cross compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-m68k-linux-gnu
      - name: Verify pinned BearSSL and compile representative 68000 subset
        run: |
          . third_party/BearSSL.lock
          test "$status" = reviewed
          chmod +x tools/probe_bearssl.sh
          BEARSSL_REPO="$upstream" \
          BEARSSL_REF="$commit" \
          BEARSSL_EXPECTED_SHA256="$archive_sha256" \
          CC=m68k-linux-gnu-gcc \
          CFLAGS='-Os -Wall -Wextra -std=c99 -m68000' \
          tools/probe_bearssl.sh

  bearssl-host-qualification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned BearSSL and run crypto/X.509 tests
        run: |
          chmod +x tools/qualify_bearssl_host.sh
          tools/qualify_bearssl_host.sh

  bearssl-vendor-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate minimal pinned client vendor tree
        run: |
          chmod +x tools/vendor_bearssl.sh
          tools/vendor_bearssl.sh
          test -f build/vendor/BearSSL/AMTLS-VENDOR-PROVENANCE.txt

  bearssl-vendor-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate vendor tree
        run: |
          chmod +x tools/vendor_bearssl.sh tools/build_vendor_bearssl.sh
          tools/vendor_bearssl.sh
      - name: Build and link minimal vendor library on host
        run: tools/build_vendor_bearssl.sh
      - name: Run host link smoke
        run: build/vendor-lib/link-smoke

  bearssl-vendor-m68k:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install m68k cross compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-m68k-linux-gnu
      - name: Generate vendor tree
        run: |
          chmod +x tools/vendor_bearssl.sh tools/build_vendor_bearssl.sh
          tools/vendor_bearssl.sh
      - name: Build and link full minimal vendor library for 68000
        run: |
          CC=m68k-linux-gnu-gcc \
          AR=m68k-linux-gnu-ar \
          CFLAGS='-Os -Wall -Wextra -std=c99 -m68000' \
          tools/build_vendor_bearssl.sh

  bearssl-client-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run TLS 1.2 ClientHello/SNI qualification
        run: |
          chmod +x tools/qualify_bearssl_client.sh
          tools/qualify_bearssl_client.sh

  bearssl-client-m68k:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install m68k cross compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-m68k-linux-gnu
      - name: Build and link BearSSL client binding for 68000
        run: |
          chmod +x tools/qualify_bearssl_client.sh
          CC=m68k-linux-gnu-gcc \
          AR=m68k-linux-gnu-ar \
          CFLAGS='-Os -Wall -Wextra -Werror -std=c99 -m68000' \
          RUN_TEST=0 \
          tools/qualify_bearssl_client.sh

  bearssl-x509-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Qualify trusted chain, hostname mismatch and unknown CA
        run: |
          chmod +x tools/qualify_bearssl_x509.sh
          tools/qualify_bearssl_x509.sh

  bearssl-transport-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Qualify TLS verification through AmTLS transport
        run: |
          chmod +x tools/qualify_bearssl_transport.sh
          tools/qualify_bearssl_transport.sh
